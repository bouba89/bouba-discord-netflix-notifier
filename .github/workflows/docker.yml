name: Docker Build & Push to GHCR

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"   # chaque lundi à 04:17 UTC

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout du code
        uses: actions/checkout@v7

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          pull: true
          no-cache: true
          tags: |
            ghcr.io/bouba89/bouba-discord-netflix-notifier:latest
            ghcr.io/bouba89/bouba-discord-netflix-notifier:${{ github.sha }}
            ghcr.io/bouba89/bouba-discord-netflix-notifier:${{ github.ref_name }}
